# pacod-id for the development stack (docker-compose.dev.yml): pacod-id.toml with the client the
# smoke test signs in with.

[[realm]]
name = "aggregator"
issuer = "${AGG_ID_ISSUER}"
brand = "gateway"
self_signup = false

[[client]]
id = "pacod-agg-ui"
realm = "aggregator"
kind = "confidential"
secret_env = "AGG_UI_CLIENT_SECRET"
redirect_uris = ["${AGG_ORIGIN}/auth/callback"]
post_logout_redirect_uris = ["${AGG_ORIGIN}/"]
initiate_login_uri = "${AGG_ORIGIN}/auth/login"
audience = "pacod-aggregator"

[[client]]
id = "pacod-agg-service"
realm = "aggregator"
kind = "service"
product = "agg"
secret_env = "AGG_ID_CLIENT_SECRET"
audience = "pacod-aggregator"

# agg-smoke: a public client that signs in by the code flow without a browser. Nothing listens at
# its redirect URI; the tool reads the code from the redirect. Development only.
[[client]]
id = "agg-smoke"
realm = "aggregator"
kind = "public"
redirect_uris = ["http://127.0.0.1:13999/callback"]
audience = "pacod-aggregator"
