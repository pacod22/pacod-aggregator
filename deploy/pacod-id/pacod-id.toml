# pacod-id for pacod-aggregator on its own: one realm and the aggregator's two clients. In the full
# stack, pacod-demo's config/pacod-id.toml holds the same two clients in its shared realm.
#
# pacod-id expands the variables below at start; an unset or empty one is fatal.
# docker-compose.standalone.yml sets them from AGG_ID_ISSUER and AGG_ORIGIN (development:
# http://127.0.0.1:18372 and http://localhost:13150).
#
# Browser endpoints (sign-in, authorize, logout) answer only when the Host is the issuer's own, so
# the issuer is the address people's browsers use. The console and the server call the token, key,
# internal and admin endpoints on the internal listener instead (http://pacod-id-internal:8071, on
# pacod-admin-net), never through the issuer.

[[realm]]
name = "aggregator"
issuer = "${AGG_ID_ISSUER}"
# pacod-id's brands are a closed list; the aggregator serves the gateway and wears its look.
brand = "gateway"
# Accounts come by invitation; no role is implicit: an account without an aggregator role sees
# "no access".
self_signup = false

# The console's sign-in. Authorization code with PKCE. The redirect URIs are exact: the console
# sends the ones built from AGG_ORIGIN, never from a request.
[[client]]
id = "pacod-agg-ui"
realm = "aggregator"
kind = "confidential"
secret_env = "AGG_UI_CLIENT_SECRET"
redirect_uris = ["${AGG_ORIGIN}/auth/callback"]
post_logout_redirect_uris = ["${AGG_ORIGIN}/"]
initiate_login_uri = "${AGG_ORIGIN}/auth/login"
audience = "pacod-aggregator"

# The server as a service: pushes the aggregator's manifest (authz/agg.yaml) and follows the
# authorization feed.
[[client]]
id = "pacod-agg-service"
realm = "aggregator"
kind = "service"
product = "agg"
secret_env = "AGG_ID_CLIENT_SECRET"
audience = "pacod-aggregator"
