rule_files:
  - ../rules/agg.rules.yml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # The jobs are on; the scraper stopped asking 10 minutes in (it asks twice a minute).
      - series: 'agg_jobs_enabled{instance="aggregator"}'
        values: "1x120"
      - series: 'agg_scraper_seen_age_seconds{instance="aggregator"}'
        values: "30x9 60+60x110"
      # One page fails every daily check from the start, one failed once.
      - series: 'agg_page_failures{vendor="moonshot", url="https://platform.kimi.ai/docs/pricing/chat"}'
        values: "3x120"
      - series: 'agg_page_failures{vendor="deepseek", url="https://api-docs.deepseek.com/quick_start/pricing"}'
        values: "1x120"
      - series: 'up{job="pacod-aggregator", instance="aggregator"}'
        values: "1x10 0x20"
    alert_rule_test:
      # Fifteen minutes absent, but not yet for five minutes.
      - eval_time: 25m
        alertname: AggregatorScraperAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: AggregatorScraperAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No aggregator scraper is running"
              description: "The jobs are switched on, but no scraper has asked for work for 36m 0s. Prices are neither checked nor confirmed."
              runbook: "docs/runbook.md#7-alerts"
      - eval_time: 30m
        alertname: AggregatorPageFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              vendor: moonshot
              url: https://platform.kimi.ai/docs/pricing/chat
            exp_annotations:
              summary: "The page https://platform.kimi.ai/docs/pricing/chat of moonshot keeps failing"
              description: "The last 3 checks of https://platform.kimi.ai/docs/pricing/chat failed. Its prices and properties are not updated, and the vendor is not published as complete."
              runbook: "docs/runbook.md#7-alerts"
      - eval_time: 5m
        alertname: AggregatorDown
        exp_alerts: []
      - eval_time: 14m
        alertname: AggregatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: pacod-aggregator
              instance: aggregator
            exp_annotations:
              summary: "pacod-aggregator does not answer"
              description: "Prometheus has not reached aggregator for two minutes. Gateways keep the model data they last read."
              runbook: "docs/runbook.md#7-alerts"
