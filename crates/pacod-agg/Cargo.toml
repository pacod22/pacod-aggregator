[package]
name = "pacod-agg"
description = "pacod-aggregator's server: the public catalogue, the admin and internal APIs, schedules and leases, extraction, and settling what pages say into the catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pacod_agg"
path = "src/lib.rs"

[[bin]]
name = "pacod-agg"
path = "src/main.rs"

[dependencies]
pacod-agg-catalog.workspace = true
pacod-agg-logging.workspace = true
pacod-id-authz.workspace = true
pacod-id-client.workspace = true

anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
pacod-id-authz = { workspace = true, features = ["vectors"] }
