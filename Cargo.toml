[workspace]
resolver = "3"
members = ["crates/pacod-agg-catalog", "crates/pacod-agg-jobs", "crates/pacod-agg-logging", "crates/pacod-agg", "crates/pacod-agg-scraper", "crates/pacod-agg-testkit"]
# pacod-id, vendored by scripts/vendor-pacod-id.sh: its crates are path dependencies, not members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
# Built into images, never published to crates.io.
publish = false

[workspace.dependencies]
pacod-agg-catalog = { path = "crates/pacod-agg-catalog" }
pacod-agg-jobs = { path = "crates/pacod-agg-jobs" }
pacod-agg-logging = { path = "crates/pacod-agg-logging" }
# pacod-id (vendor/pacod-id, pinned in vendor/pacod-id/VERSION): the rules engine and the client
# library the API checks its callers with.
pacod-id-authz = { path = "vendor/pacod-id/crates/pacod-id-authz" }
pacod-id-client = { path = "vendor/pacod-id/crates/pacod-id-client" }

# The versions pacod-gw uses, so that one copy of each is built where both meet.
anyhow = "1"
axum = { version = "0.8", features = ["http2", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
cron = "0.17"
futures-util = "0.3"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = { version = "0.20", default-features = false }
mimalloc = { version = "0.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
ring = "0.17"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "chrono", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
